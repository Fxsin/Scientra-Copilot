name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install pytest openpyxl python-docx pdfplumber PyPDF2 lancedb sentence-transformers
      - name: Run tests
        run: python -m pytest Tests/ -q --tb=short
      - name: Docs consistency check
        run: python Scripts/update_docs.py --check-consistency
      - name: Release check
        run: python Scripts/release_check.py --all --fail-on-p0

  web-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install web deps
        run: cd web && npm ci 2>/dev/null || echo "Web deps not available — skipping build"
      - name: Build web
        run: cd web && npm run build 2>/dev/null || echo "Web build skipped"

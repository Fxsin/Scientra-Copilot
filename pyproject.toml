[project]
name = "scientra"
version = "0.2.1"
description = "Scientra Copilot — Your Literature, Structured. LLM-Powered Literature Knowledge OS for Researchers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Scientra Copilot Contributors"}
]
keywords = [
    "literature-review",
    "scientific-papers",
    "knowledge-management",
    "vector-search",
    "llm",
    "embedding",
    "research-tools",
    "literature-mining",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Markup",
]

dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "lancedb>=0.4",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "sentence-transformers>=2.2",
    "torch>=2.0",
    "pydantic>=2.0",
    "pyarrow>=12.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.0",
]
grobid = [
    "docker>=6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scientra", "scientra.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["Tests"]

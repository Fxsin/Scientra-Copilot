      - peritrophic matrix
      - insect midgut PM
    include_patterns:
      - '\bperitrophic\s+(membrane|matrix)\b'
      - '\binsect\s+midgut\s+PM\b'
      - '\bPM\b(?=.{0,80}\b(midgut|larva|larvae|insect|peritrophic)\b)'
      - '\b(midgut|larva|larvae|insect|peritrophic)\b.{0,80}\bPM\b'
    exclude_patterns:
      - '\b\d+(?:\.\d+)?\s*pM\b'
      - '\bpM\b(?=\s*(?:toxin|protein|competitor|binding|concentration|solution|buffer|nM|mM|uM|µM|μM|mol|molar))'

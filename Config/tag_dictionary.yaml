dictionary_version: "2026-06-08.v2"
description: "Default Scientra Copilot tag dictionary. Add or edit tag rules here, not in tag_engine.py."
defaults:
  weight: 1.0
  min_score: 1.0

tags:
  Cry:
    synonyms:
      - Cry toxin
      - Cry protein
      - Cry family
      - Cry1
      - Cry2
      - Cry3
      - Cry4
      - Cry11
      - Cry1A
      - Cry1Ab
      - Cry1Ac
      - Cry2A
      - Cry2Ab
      - Cry3A
      - Cry3Ba
      - Cry4A
      - Cry4B
      - Cry11A
      - Bacillus thuringiensis Cry
    include_patterns:
      - '\bCry(?:1|2|3|4|11)[A-Za-z0-9]*(?:\s+(?:toxin|protein|family))?\b'
      - '\bCry\s+(?:toxin|protein|family)s?\b'
      - '\bBacillus\s+thuringiensis\s+Cry(?:1|2|3|4|11)?[A-Za-z0-9]*\b'
    exclude_patterns:
      - '\bCryo\b'
      - '\bcryo[- ]?EM\b'
      - '\bcryo[- ]?electron\s+microscopy\b'
      - '\bcryogenic\b'
      - '\bcrystal(s)?\b'
      - '\bcrystalline\b'
      - '\bcrystallization\b'
      - '\bcrystallisation\b'
      - '\bcryopreservation\b'
      - '\bCRISPR(?:[-/ ]Cas9)?\b'
      - '\bCas9\b'
      - '\bgenome\s+editing\b'
      - '\bcry\s+(for|out|baby|wolf)\b'
      - '\b(no|not|without|absence|lack|do\s+not|does\s+not|did\s+not)\b.{0,80}\bCry(?:1|2|3|4|11)?[A-Za-z0-9]*\b'
      - '\bCry(?:1|2|3|4|11)?[A-Za-z0-9]*\b.{0,80}\b(no|not|without|absence|lack|do\s+not|does\s+not|did\s+not)\b'
    weight: 1.0
    min_score: 3.0
    assignment_requires_sections:
      - title
    candidate_only_sections:
      - abstract
      - introduction
      - methods
      - references

  Vip3:
    synonyms:
      - Vip3
      - Vip3A
      - Vip3Aa
      - vegetative insecticidal protein 3
      - vegetative insecticidal proteins
    include_patterns:
      - '\bVip3[A-Za-z0-9]*\b'
      - '\bvegetative\s+insecticidal\s+protein\s*3[A-Za-z0-9]*\b'
    exclude_patterns: []
    weight: 1.0
    min_score: 1.0

  Cyt:
    synonyms:
      - Cyt toxin
      - Cyt protein
      - Cyt1
      - Cyt1A
      - Cyt2
      - Cyt2A
      - cytolytic toxin
    include_patterns:
      - '\bCyt(?:1|2)[A-Za-z0-9]*(?:\s+(?:toxin|protein))?\b'
      - '\bCyt\s+(?:toxin|protein)s?\b'
      - '\bcytolytic\s+(toxin|protein)s?\b'
    exclude_patterns:
      - '\bcytotoxic\b'
      - '\bcytoskeletal\b'
      - '\bcytology\b'
      - '\bcytosol\b'
    weight: 1.0
    min_score: 1.0

  Mpp:

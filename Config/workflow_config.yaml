workflow_version: "2026-06-08.v1"
description: "Scientra Copilot workflow configuration."

paths:
  root: "."
  inbox_dir: "00_Inbox"
  pdf_dir: "01_PDF"
  metadata_dir: "02_Metadata"
  summary_dir: "03_Summary"
  vector_db_dir: "04_VectorDB/lancedb"
  index_dir: "05_Index"
  workflow_dir: "07_Workflows"
  log_dir: "07_Workflows/logs"
  report_dir: "07_Workflows/reports"
  state_path: "07_Workflows/workflow_state.json"
  failure_path: "07_Workflows/workflow_failures.jsonl"

runtime:
  python: "python"
  python_no_bytecode: true
  stop_on_failure: true
  continue_on_optional_failure: true
  default_timeout_seconds: 3600

steps:
  import_pdf:
    enabled: true
    description: "Copy incoming PDFs into 01_PDF."

  parse:
    enabled: true
    description: "PDF -> GROBID parse -> metadata JSON and raw_text."
    command:
      module: null
      script: "Scripts/pdf_parser.py"
      args: []
    timeout_seconds: 7200

  metadata:
    enabled: true
    description: "Generate metadata.yaml using DOI, Crossref, PubMed, and rules."
    command:
      module: null
      script: "Scripts/metadata_extractor.py"
      args: []
    timeout_seconds: 3600

  tag:
    enabled: true
    description: "Assign configured tags through Tag Engine."
    command:
      module: null
      script: "Scripts/retag.py"
      args:
        - "--all"
    timeout_seconds: 1800

  summary:
    enabled: true
    description: "Generate summary.md with Summary Agent (default) or Summary Engine (legacy)."
    mode: "agent"
    fallback_mode: "direct_api"
    optional: true
    command:
      module: "scientra.summary"
      script: null
      args:
        - "--all"
    timeout_seconds: 7200

  hybrid_parse:
    enabled: true
    description: "Run Hybrid Parser (PyMuPDF + GROBID + OpenDataLoader + Marker fallback) on all PDFs."
    optional: true
    builtin: "hybrid_parse"
    timeout_seconds: 7200

  evidence:
    enabled: true
    description: "Extract structured evidence from sections and summaries (optional, non-blocking)."
    optional: true
    command:
      module: "scientra.evidence_extraction"
      script: null
      args: []
    timeout_seconds: 3600

  evidence_chunks:
    enabled: true
    description: "Convert evidence.json into searchable chunks for embedding (optional, non-blocking)."
    optional: true
    command:
      module: "scientra.evidence_chunks"
      script: null
      args: []
    timeout_seconds: 1800

  embedding:
    enabled: true
    description: "Build BGE-M3 embeddings for metadata, summary, and chunk levels."
    command:
      module: "scientra.embedding"
      script: null
      args:
        - "index"
    timeout_seconds: 7200

  lancedb:
    enabled: true
    description: "Verify LanceDB index report after embedding."
    builtin: "verify_lancedb"

  index_update:
    enabled: true
    description: "Write workflow index report."
    builtin: "index_update"

# ── Hybrid PDF Parser Configuration ──
# WARNING: enabled: false is the DEFAULT and SAFE setting.
# Set to true only after verifying parser dependencies are installed.
hybrid_parser:
  enabled: false
  use_grobid: true
  use_opendataloader: true
  use_marker: auto            # "auto" | true | false. "auto" triggers Marker when ODL quality < marker_trigger_score
  use_pymupdf: true
  prefer_markdown_source: opendataloader    # "opendataloader" | "marker"
  fallback_markdown_source: marker          # "marker" | "none"
  marker_trigger_score: 0.65  # Auto-trigger Marker when ODL markdown score is below this
  prefer_hybrid_markdown_for_evidence: false  # P1: Use final markdown for evidence extraction (DEFAULT: false, legacy safe)
  min_final_markdown_score_for_evidence: 0.65  # P1: Minimum quality score to use hybrid markdown for evidence
  save_layout_bbox: true
  save_raw_figures: true
  output_root: "02_Parse"
  manifest_dir: "02_Parse/reports/hybrid"

policy:
  agent_entrypoint: "literature_query"
  agent_pdf_access: "forbidden"
  agent_direct_lancedb_access: "forbidden"
  workflow_regenerates_embedding_only_when_inputs_change: true

workflow_version: "2026-06-08.v1"
description: "Scientra Copilot workflow configuration."

paths:
  root: "."
  inbox_dir: "00_Inbox"
  pdf_dir: "01_PDF"
  metadata_dir: "02_Metadata"
  summary_dir: "03_Summary"
  vector_db_dir: "04_VectorDB/lancedb"
  index_dir: "05_Index"
  workflow_dir: "07_Workflows"
  log_dir: "07_Workflows/logs"
  report_dir: "07_Workflows/reports"
  state_path: "07_Workflows/workflow_state.json"
  failure_path: "07_Workflows/workflow_failures.jsonl"

runtime:
  python: "python"
  python_no_bytecode: true
  stop_on_failure: true
  continue_on_optional_failure: true
  default_timeout_seconds: 3600

steps:
  import_pdf:
    enabled: true
    description: "Copy incoming PDFs into 01_PDF."

  parse:
    enabled: true
    description: "PDF -> GROBID parse -> metadata JSON and raw_text."
    command:
      module: null
      script: "Scripts/pdf_parser.py"
      args: []
    timeout_seconds: 7200

  metadata:
    enabled: true
    description: "Generate metadata.yaml using DOI, Crossref, PubMed, and rules."
    command:
      module: null
      script: "Scripts/metadata_extractor.py"
      args: []
    timeout_seconds: 3600

  tag:
    enabled: true
    description: "Assign configured tags through Tag Engine."
    command:
      module: null
      script: "Scripts/retag.py"
      args:
        - "--all"
    timeout_seconds: 1800

  summary:
    enabled: true
    description: "Generate summary.md with Summary Agent (default) or Summary Engine (legacy)."
    mode: "agent"
    fallback_mode: "direct_api"
    optional: true
    command:
      module: "scientra.summary"
      script: null
      args:
        - "--all"
    timeout_seconds: 7200

  hybrid_parse:
    enabled: true
    description: "Run Hybrid Parser (PyMuPDF + GROBID + OpenDataLoader + Marker fallback) on all PDFs."
    optional: true
    builtin: "hybrid_parse"
    timeout_seconds: 7200

  evidence:
    enabled: true
    description: "Extract structured evidence from sections and summaries (optional, non-blocking)."
    optional: true
    command:
      module: "scientra.evidence_extraction"
      script: null
      args: []
    timeout_seconds: 3600

  evidence_chunks:
    enabled: true
    description: "Convert evidence.json into searchable chunks for embedding (optional, non-blocking)."
    optional: true
    command:
      module: "scientra.evidence_chunks"
      script: null
      args: []
    timeout_seconds: 1800

  embedding:
    enabled: true
    description: "Build BGE-M3 embeddings for metadata, summary, and chunk levels."
    command:
      module: "scientra.embedding"
      script: null
      args:
        - "index"
    timeout_seconds: 7200

  ai_summary_v2:
    enabled: true
    optional: true
    description: "Generate AI-enhanced Summary V2 for all papers with evidence (Phase 2.2)."
    builtin: "ai_summary_v2"
    timeout_seconds: 3600

  ai_evidence_enrichment:
    enabled: true
    optional: true
    description: "Enrich evidence chunks with AI analysis (Phase 2.2)."
    builtin: "ai_evidence_enrichment"
    timeout_seconds: 7200

  ai_gap_extraction:
    enabled: true
    optional: true
    description: "Extract research gaps from Summary V2 and Evidence Enrichment (Phase 2.3)."
    builtin: "ai_gap_extraction"
    timeout_seconds: 3600

  ai_hypothesis_generation:
    enabled: true
    optional: true
    description: "Generate testable hypotheses from identified gaps (Phase 2.3)."
    builtin: "ai_hypothesis_generation"
    timeout_seconds: 3600

  lancedb:
    enabled: true
    description: "Verify LanceDB index report after embedding."
    builtin: "verify_lancedb"

  index_update:
    enabled: true
    description: "Write workflow index report."
    builtin: "index_update"

# ── Hybrid PDF Parser Configuration ──
# WARNING: enabled: false is the DEFAULT and SAFE setting.
# Set to true only after verifying parser dependencies are installed.
hybrid_parser:
  enabled: false
  use_grobid: true
  use_opendataloader: true
  use_marker: auto            # "auto" | true | false. "auto" triggers Marker when ODL quality < marker_trigger_score
  use_pymupdf: true
  prefer_markdown_source: opendataloader    # "opendataloader" | "marker"
  fallback_markdown_source: marker          # "marker" | "none"
  marker_trigger_score: 0.65  # Auto-trigger Marker when ODL markdown score is below this
  prefer_hybrid_markdown_for_evidence: false  # P1: Use final markdown for evidence extraction (DEFAULT: false, legacy safe)
  min_final_markdown_score_for_evidence: 0.65  # P1: Minimum quality score to use hybrid markdown for evidence
  save_layout_bbox: true
  save_raw_figures: true
  output_root: "02_Parse"
  manifest_dir: "02_Parse/reports/hybrid"

# ── Phase 2.2: AI Enrichment Configuration ──
ai_enrichment:
  enabled: false              # DEFAULT: false (legacy safe mode). Set to true to enable.
  summary_v2: false           # Generate AI-enhanced Summary V2
  evidence_enrichment: false  # Enrich evidence chunks with AI analysis
  gap_extraction: false       # Extract research gaps (Phase 2.3)
  hypothesis_generation: false # Generate testable hypotheses (Phase 2.3)
  batch_size: 8               # Chunks per LLM call batch
  max_chunks_per_paper: 40    # Max chunks to process per paper
  min_chunk_length: 80        # Skip chunks shorter than this (characters)
  max_gaps_per_paper: 8       # Max gaps to extract per paper
  max_hypotheses_per_paper: 8 # Max hypotheses to generate per paper
  paper_limit: 0              # Max papers to process (0 = all papers)

# ── Phase 3.1: Cross-Paper Discovery ──
cross_paper_discovery:
  gap_fusion_enabled: false
  gap_fusion_method: community_detection
  community_similarity_threshold: 0.72
  min_community_size: 1
  strong_support_paper_count: 3
  allow_cross_type_gap_fusion: false
  hypothesis_fusion_enabled: false
  hypothesis_fusion_method: community_detection
  hypothesis_similarity_threshold: 0.72
  min_hypothesis_community_size: 1
  opportunity_ranking_enabled: false
  opportunity_min_paper_count: 2
  opportunity_top_k: 50
  scoring_weights:
    evidence: 0.30
    feasibility: 0.25
    novelty: 0.20
    impact: 0.15
    confidence: 0.10
    risk_penalty: 0.10

policy:
  agent_entrypoint: "literature_query"
  agent_pdf_access: "forbidden"
  agent_direct_lancedb_access: "forbidden"
  workflow_regenerates_embedding_only_when_inputs_change: true
